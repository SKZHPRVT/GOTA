<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="full-screen" content="yes">
    <title>GOta</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --content-top: var(--tg-content-safe-area-inset-top, 0px);
            --content-bottom: var(--tg-content-safe-area-inset-bottom, 0px);
            --content-left: var(--tg-content-safe-area-inset-left, 0px);
            --content-right: var(--tg-content-safe-area-inset-right, 0px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: none;
            color: #fff;
            position: fixed;
            inset: 0;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #top-hud {
            position: fixed;
            top: calc(10px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 10;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }
        #score-t { color: #FFD24A; font-size: 28px; }
        #score-ct { color: #5CA8FF; font-size: 28px; }
        #round-timer { color: #fff; font-size: 20px; min-width: 60px; text-align: center; }

        #round-info {
            position: fixed;
            top: calc(70px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 14px;
            opacity: 0.85;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        /* === BOMB HUD === */
        #bomb-hud {
            position: fixed;
            top: calc(100px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        #bomb-hud.show { display: flex; }

        #bomb-timer {
            font-size: 48px;
            font-weight: bold;
            color: #ff3030;
            text-shadow: 0 0 20px #ff0000, 3px 3px 6px #000;
            padding: 8px 24px;
            background: rgba(0,0,0,0.7);
            border: 3px solid #ff3030;
            border-radius: 12px;
            letter-spacing: 3px;
            animation: bombPulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes bombPulse {
            from { transform: scale(1); box-shadow: 0 0 20px rgba(255,0,0,0.5); }
            to { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,0,0,0.9); }
        }

        #bomb-status {
            font-size: 16px;
            font-weight: bold;
            padding: 4px 16px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        #defuse-bar {
            width: 240px;
            height: 16px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }
        #defuse-bar.show { display: block; }
        #defuse-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00cc00, #00ff00);
            transition: width 0.1s linear;
        }

        #hp-hud {
            position: fixed;
            bottom: calc(20px + var(--content-bottom));
            left: calc(190px + var(--content-left));
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
            pointer-events: none;
        }
        #joystick {
            position: fixed;
            bottom: calc(30px + var(--content-bottom));
            left: calc(30px + var(--content-left));
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            width: 60px; height: 60px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            pointer-events: none;
        }
        #abilities {
            position: fixed;
            bottom: calc(30px + var(--content-bottom));
            right: calc(30px + var(--content-right));
            display: flex;
            gap: 14px;
            z-index: 10;
        }
        .ability {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            transition: transform 0.1s, background 0.15s;
        }
        .ability:active { transform: scale(0.92); }
        .ability.active {
            background: rgba(220, 40, 40, 0.55);
            border-color: #FF5555;
            box-shadow: 0 0 20px rgba(255,80,80,0.7);
        }
        .ability.inactive { opacity: 0.35; }
        .ability.defuse {
            background: rgba(0, 200, 0, 0.5);
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.7);
        }

        #banner {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px; font-weight: bold;
            text-shadow: 3px 3px 6px #000;
            z-index: 20;
            display: none;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="top-hud">
        <span id="score-t">T 0</span>
        <span id="round-timer">60</span>
        <span id="score-ct">CT 0</span>
    </div>
    <div id="round-info">Раунд 1 / 5</div>

    <!-- BOMB HUD -->
    <div id="bomb-hud">
        <div id="bomb-timer">40</div>
        <div id="bomb-status">💣 Бомба заложена!</div>
        <div id="defuse-bar"><div id="defuse-bar-fill"></div></div>
    </div>

    <div id="hp-hud">HP: 100</div>

    <div id="joystick">
        <div id="joystick-knob"></div>
    </div>

    <div id="abilities">
        <div class="ability" id="ability-1">💣</div>
        <div class="ability" id="ability-2">🔨</div>
    </div>

    <div id="banner"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
