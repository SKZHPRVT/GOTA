<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="full-screen" content="yes">
    <title>GOta</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --content-top: var(--tg-content-safe-area-inset-top, 0px);
            --content-bottom: var(--tg-content-safe-area-inset-bottom, 0px);
            --content-left: var(--tg-content-safe-area-inset-left, 0px);
            --content-right: var(--tg-content-safe-area-inset-right, 0px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: none;
            color: #fff;
            position: fixed;
            inset: 0;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* === TOP HUD: score + timer === */
        #top-hud {
            position: fixed;
            top: calc(8px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        .score-box {
            background: rgba(0,0,0,0.65);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 6px 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        #score-t { color: #FFD24A; font-size: 24px; }
        #score-ct { color: #5CA8FF; font-size: 24px; }
        #round-timer {
            color: #fff;
            font-size: 22px;
            background: rgba(0,0,0,0.65);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 6px 14px;
            min-width: 70px;
            text-align: center;
        }

        #round-info {
            position: fixed;
            top: calc(60px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 12px;
            opacity: 0.8;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        /* === BOMB COMPASS === */
        #bomb-compass {
            position: fixed;
            top: calc(85px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }
        #bomb-compass.show { display: flex; }

        #compass-arrow {
            font-size: 28px;
            color: #ff3030;
            text-shadow: 0 0 10px #ff0000;
            transition: transform 0.15s linear;
            display: inline-block;
        }
        #compass-distance {
            font-size: 12px;
            font-weight: bold;
            color: #ffd24a;
            background: rgba(0,0,0,0.6);
            padding: 2px 10px;
            border-radius: 6px;
        }

        /* === BOMB TIMER (24px) === */
        #bomb-hud {
            position: fixed;
            top: calc(140px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }
        #bomb-hud.show { display: flex; }

        #bomb-timer {
            font-size: 24px;
            font-weight: bold;
            color: #ff3030;
            text-shadow: 0 0 12px #ff0000, 2px 2px 4px #000;
            padding: 4px 14px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ff3030;
            border-radius: 8px;
            letter-spacing: 2px;
        }

        #bomb-status {
            font-size: 13px;
            font-weight: bold;
            padding: 3px 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 6px;
            text-shadow: 1px 1px 2px #000;
        }

        #defuse-bar {
            width: 200px;
            height: 12px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            border-radius: 6px;
            overflow: hidden;
            display: none;
        }
        #defuse-bar.show { display: block; }
        #defuse-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00cc00, #00ff00);
            transition: width 0.1s linear;
        }

        /* === HP === */
        #hp-hud {
            position: fixed;
            bottom: calc(20px + var(--content-bottom));
            left: calc(190px + var(--content-left));
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
            pointer-events: none;
        }

        /* Красная вспышка урона */
        #damage-flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center,
                rgba(255,0,0,0) 30%,
                rgba(255,0,0,0.5) 100%);
            opacity: 0;
            z-index: 8;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
        }
        #damage-flash.flash { opacity: 1; }

        /* Джойстик */
        #joystick {
            position: fixed;
            bottom: calc(30px + var(--content-bottom));
            left: calc(30px + var(--content-left));
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            width: 60px; height: 60px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Способности */
        #abilities {
            position: fixed;
            bottom: calc(30px + var(--content-bottom));
            right: calc(30px + var(--content-right));
            display: flex;
            gap: 14px;
            z-index: 10;
        }
        .ability {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            transition: transform 0.1s, background 0.15s;
        }
        .ability:active { transform: scale(0.92); }
        .ability.active {
            background: rgba(220, 40, 40, 0.55);
            border-color: #FF5555;
            box-shadow: 0 0 20px rgba(255,80,80,0.7);
        }
        .ability.inactive { opacity: 0.35; }

        #banner {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px; font-weight: bold;
            text-shadow: 3px 3px 6px #000;
            z-index: 20;
            display: none;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="damage-flash"></div>

    <div id="top-hud">
        <div class="score-box" id="score-t">T 0</div>
        <div id="round-timer">60</div>
        <div class="score-box" id="score-ct">CT 0</div>
    </div>
    <div id="round-info">Раунд 1 / 5</div>

    <!-- Компас на бомбу -->
    <div id="bomb-compass">
        <span id="compass-arrow">▲</span>
        <span id="compass-distance">0м</span>
    </div>

    <!-- HUD бомбы -->
    <div id="bomb-hud">
        <div id="bomb-timer">40</div>
        <div id="bomb-status">💣 Бомба заложена!</div>
        <div id="defuse-bar"><div id="defuse-bar-fill"></div></div>
    </div>

    <div id="hp-hud">HP: 100</div>

    <div id="joystick">
        <div id="joystick-knob"></div>
    </div>

    <div id="abilities">
        <div class="ability" id="ability-1">💣</div>
        <div class="ability" id="ability-2">🔨</div>
    </div>

    <div id="banner"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
