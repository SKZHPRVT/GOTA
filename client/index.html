<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="full-screen" content="yes">
    <title>GOTA</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: none;
            color: #fff;
            position: fixed;
            inset: 0;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* LOADING */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #1a1410 0%, #2a2018 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        #loading-screen.hide { opacity: 0; pointer-events: none; }
        #loading-logo {
            font-size: 64px; font-weight: bold;
            color: #FFD24A;
            text-shadow: 0 0 30px rgba(255, 210, 74, 0.6), 4px 4px 8px #000;
            margin-bottom: 8px; letter-spacing: 4px;
        }
        #loading-subtitle {
            font-size: 14px; color: #C2B280;
            margin-bottom: 48px; letter-spacing: 2px; opacity: 0.8;
        }
        #loading-bar-container {
            width: 280px; height: 8px;
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,210,74,0.4);
            border-radius: 6px; overflow: hidden; margin-bottom: 16px;
        }
        #loading-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #FFD24A, #FFA500);
            border-radius: 4px; transition: width 0.2s ease-out;
            box-shadow: 0 0 10px rgba(255,210,74,0.8);
        }
        #loading-text {
            font-size: 14px; color: #FFD24A; font-weight: bold;
            margin-bottom: 4px; min-height: 20px;
        }
        #loading-percent {
            font-size: 22px; color: #fff; font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* TOP HUD */
        #top-hud {
            position: fixed;
            top: 4px;
            left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            pointer-events: none;
        }
        .score-box {
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 4px 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        #score-t { color: #FFD24A; font-size: 20px; }
        #score-ct { color: #5CA8FF; font-size: 20px; }
        #round-timer {
            color: #fff;
            font-size: 18px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 4px 12px;
            min-width: 60px;
            text-align: center;
        }

        /* BOMB HUD */
        #bomb-hud {
            position: fixed;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            pointer-events: none;
        }
        #bomb-hud.show { display: flex; }
        #bomb-timer {
            font-size: 18px;
            font-weight: bold;
            color: #ff3030;
            text-shadow: 0 0 8px #ff0000, 1px 1px 3px #000;
            padding: 2px 10px;
            background: rgba(0,0,0,0.75);
            border: 2px solid #ff3030;
            border-radius: 6px;
            letter-spacing: 1px;
        }
        #bomb-status {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            background: rgba(0,0,0,0.6);
            border-radius: 4px;
        }
        #defuse-bar {
            width: 140px; height: 8px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            border-radius: 4px; overflow: hidden;
            display: none;
        }
        #defuse-bar.show { display: block; }
        #defuse-bar-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #00cc00, #00ff00);
            transition: width 0.1s linear;
        }

        /* HP */
        #hp-hud {
            position: fixed;
            bottom: 20px;
            left: 190px;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
            pointer-events: none;
        }

        #damage-flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center,
                rgba(255,0,0,0) 30%, rgba(255,0,0,0.6) 100%);
            opacity: 0;
            z-index: 8;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
        }
        #damage-flash.flash { opacity: 1; }

        /* JOYSTICK */
        #joystick {
            position: fixed;
            bottom: 30px; left: 30px;
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            width: 60px; height: 60px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            pointer-events: none;
        }
        #abilities {
            position: fixed;
            bottom: 30px; right: 30px;
            display: flex; gap: 14px;
            z-index: 10;
        }
        .ability {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            transition: transform 0.1s, background 0.15s;
        }
        .ability:active { transform: scale(0.92); }
        .ability.active {
            background: rgba(220, 40, 40, 0.55);
            border-color: #FF5555;
            box-shadow: 0 0 20px rgba(255,80,80,0.7);
        }
        .ability.inactive { opacity: 0.35; }

        #banner {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px; font-weight: bold;
            text-shadow: 3px 3px 6px #000;
            z-index: 20;
            display: none;
            text-align: center;
            pointer-events: none;
        }

        /* === DEATH MODAL === */
        #death-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }
        #death-modal.show { display: flex; }
        #death-title {
            font-size: 52px;
            font-weight: bold;
            color: #ff3030;
            text-shadow: 0 0 30px #ff0000, 3px 3px 6px #000;
            margin-bottom: 12px;
            letter-spacing: 4px;
        }
        #death-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        #death-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 500px;
        }
        .death-btn {
            padding: 16px 28px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: rgba(30,30,30,0.9);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            user-select: none;
            touch-action: manipulation;
            min-width: 180px;
        }
        .death-btn:active { transform: scale(0.95); }
        .death-btn:hover { background: rgba(80,80,80,0.9); }
        .death-btn.primary {
            background: rgba(200,30,30,0.8);
            border-color: #ff5555;
        }

        /* === SPECTATE MODE indicator === */
        #spectate-indicator {
            position: fixed;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #FFD24A;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            color: #FFD24A;
            z-index: 12;
            display: none;
            text-shadow: 1px 1px 2px #000;
        }
        #spectate-indicator.show { display: block; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div id="loading-logo">GOTA</div>
        <div id="loading-subtitle">DOTA × COUNTER-STRIKE</div>
        <div id="loading-bar-container"><div id="loading-bar-fill"></div></div>
        <div id="loading-text">Загрузка...</div>
        <div id="loading-percent">0%</div>
    </div>

    <div id="damage-flash"></div>

    <div id="top-hud">
        <div class="score-box" id="score-t">T 0</div>
        <div id="round-timer">60</div>
        <div class="score-box" id="score-ct">CT 0</div>
    </div>

    <div id="bomb-hud">
        <div id="bomb-timer">40</div>
        <div id="bomb-status">💣 Заложена</div>
        <div id="defuse-bar"><div id="defuse-bar-fill"></div></div>
    </div>

    <div id="spectate-indicator">👁 НАБЛЮДЕНИЕ</div>

    <div id="hp-hud">HP: 100</div>

    <div id="joystick"><div id="joystick-knob"></div></div>
    <div id="abilities">
        <div class="ability" id="ability-1">💣</div>
        <div class="ability" id="ability-2">🔨</div>
    </div>

    <div id="banner"></div>

    <div id="death-modal">
        <div id="death-title">💀 ТЫ УБИТ</div>
        <div id="death-subtitle">Выбери действие</div>
        <div id="death-buttons">
            <button class="death-btn" id="death-spectate">👁 Наблюдать</button>
            <button class="death-btn primary" id="death-takeover">🔄 Занять бота</button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
