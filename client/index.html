<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="full-screen" content="yes">
    <title>GOta</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        (function() {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) {
                console.warn('[tg-head] Telegram.WebApp не найден');
                return;
            }

            // Функция лочения landscape
            window.__tgLockLandscape = function() {
                if (!tg.lockOrientation) {
                    console.warn('[tg] lockOrientation недоступен (Bot API < 8.0)');
                    return;
                }
                try {
                    tg.lockOrientation('landscape');
                    console.log('[tg] locked to landscape');
                } catch (e) {
                    console.error('[tg] lockOrientation failed:', e);
                }
            };

            try {
                tg.ready();
                tg.expand();
                if (tg.requestFullscreen) tg.requestFullscreen();
                if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
                if (tg.setHeaderColor) tg.setHeaderColor('#000000');
                if (tg.setBackgroundColor) tg.setBackgroundColor('#C2B280');
            } catch (e) {
                console.error('[tg-head]', e);
            }

            // Лочим landscape только когда fullscreen активен
            if (tg.onEvent) {
                tg.onEvent('fullscreenChanged', function() {
                    console.log('[tg] fullscreenChanged. isFullscreen =', tg.isFullscreen);
                    if (tg.isFullscreen) {
                        window.__tgLockLandscape();
                    }
                });

                tg.onEvent('fullscreenFailed', function(e) {
                    console.error('[tg] fullscreenFailed:', e);
                    window.__tgLockLandscape();
                });

                tg.onEvent('viewportChanged', function(e) {
                    console.log('[tg] viewport h=', tg.viewportHeight, 'stable=', tg.viewportStableHeight, 'stable?', e.isStateStable);
                });
            }

            // Fallback: если fullscreen уже активен
            setTimeout(function() {
                if (tg.isFullscreen) {
                    window.__tgLockLandscape();
                }
            }, 500);

            // Плюс — по первому тапу пользователя
            var firstTap = function() {
                window.__tgLockLandscape();
                document.removeEventListener('touchstart', firstTap);
                document.removeEventListener('click', firstTap);
            };
            document.addEventListener('touchstart', firstTap, { once: true });
            document.addEventListener('click', firstTap, { once: true });

        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --safe-top: var(--tg-safe-area-inset-top, 0px);
            --safe-bottom: var(--tg-safe-area-inset-bottom, 0px);
            --safe-left: var(--tg-safe-area-inset-left, 0px);
            --safe-right: var(--tg-safe-area-inset-right, 0px);
            --content-top: var(--tg-content-safe-area-inset-top, 0px);
            --content-bottom: var(--tg-content-safe-area-inset-bottom, 0px);
            --content-left: var(--tg-content-safe-area-inset-left, 0px);
            --content-right: var(--tg-content-safe-area-inset-right, 0px);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            touch-action: none;
            color: #fff;
            position: fixed;
            inset: 0;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #top-hud {
            position: fixed;
            top: calc(10px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 10;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        #score-t { color: #FFD24A; font-size: 28px; }
        #score-ct { color: #5CA8FF; font-size: 28px; }
        #round-timer { color: #fff; font-size: 20px; min-width: 60px; text-align: center; }

        #round-info {
            position: fixed;
            top: calc(70px + var(--content-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 14px;
            opacity: 0.85;
            text-shadow: 1px 1px 2px #000;
        }
        #hp-hud {
            position: fixed;
            bottom: calc(20px + var(--content-bottom));
            left: calc(190px + var(--content-left));
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
        }
        #joystick {
            position: fixed;
            bottom: calc(30px + var(--content-bottom));
            left: calc(30px + var(--content-left));
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            width: 60px; height: 60px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            pointer-events: none;
        }
        #abilities {
            position: fixed;
            bottom: calc(30px + var(--content-bottom));
            right: calc(30px + var(--content-right));
            display: flex;
            gap: 14px;
            z-index: 10;
        }
        .ability {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
            transition: transform 0.1s, background 0.15s;
        }
        .ability:active { transform: scale(0.92); }
        .ability.active {
            background: rgba(220, 40, 40, 0.55);
            border-color: #FF5555;
            box-shadow: 0 0 20px rgba(255,80,80,0.7);
        }
        .ability.inactive { opacity: 0.35; }

        #banner {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 56px; font-weight: bold;
            text-shadow: 3px 3px 6px #000;
            z-index: 20;
            display: none;
            text-align: center;
            pointer-events: none;
        }
        #rotate-hint {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111; color: #fff;
            display: none;
            justify-content: center; align-items: center;
            flex-direction: column;
            font-size: 22px; z-index: 100;
            text-align: center; padding: 20px;
        }
        @media (orientation: portrait) {
            #rotate-hint { display: flex; }
        }
    </style>
</head>
<body>
    <div id="rotate-hint">📱 Поверни телефон горизонтально</div>

    <div id="top-hud">
        <span id="score-t">T 0</span>
        <span id="round-timer">60</span>
        <span id="score-ct">CT 0</span>
    </div>
    <div id="round-info">Раунд 1 / 5</div>
    <div id="hp-hud">HP: 100</div>

    <div id="joystick">
        <div id="joystick-knob"></div>
    </div>

    <div id="abilities">
        <div class="ability" id="ability-1">💣</div>
        <div class="ability" id="ability-2">🔨</div>
    </div>

    <div id="banner"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
